# The API runs on Render. Scheduled collection runs for free in GitHub Actions
# (see .github/workflows/collect.yml), so no worker service is needed here.
services:
  - type: web
    name: openhunt-api
    runtime: docker
    # Render's default plan is the paid Starter tier, so the free plan must be explicit.
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: openHunt
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: JOB_FETCH_INTERVAL_MINUTES
        value: 30
      - key: MAX_JOBS_PER_RUN
        value: 50
      - key: REQUEST_TIMEOUT_SECONDS
        value: 20
      - key: REQUESTS_PER_MINUTE
        value: 20
      - key: USER_AGENT
        value: openHunt/0.1 (+https://example.com; contact@example.com)
      - key: API_TIMEOUT_SECONDS
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_MONTHLY_CAP
        value: 250
      - key: SERPER_API_KEY
        sync: false
      # Comma-separated emails allowed to create an account (include your own).
      - key: ALLOWED_SIGNUP_EMAILS
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: GMAIL_POLL_INTERVAL_MINUTES
        value: 10
      - key: WEB_APP_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
