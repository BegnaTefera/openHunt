name: Collect jobs

# Free scheduled collection. This replaces the always-on worker, so nothing here
# needs a paid host. GitHub may delay scheduled runs by several minutes.
on:
  schedule:
    - cron: "17 * * * *" # hourly, at minute 17
  workflow_dispatch:
    inputs:
      steps:
        description: "discovery, companies, boards, or all"
        default: "all"

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: api
      # Required secret: your Neon connection string.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The collectors never use these two, but the shared settings class requires
      # a value for them. They are placeholders, not real credentials.
      SECRET_KEY: collector-job-placeholder
      DEFAULT_PASSWORD: collector-job-placeholder
      USER_AGENT: ${{ vars.USER_AGENT || 'openHunt/0.1 (+https://github.com; personal job search)' }}
      # Optional: leave the secrets unset to skip a source.
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Apply database migrations
        working-directory: api
        run: python -m alembic upgrade head

      - name: Run collectors
        run: python -m worker.run_once ${{ github.event.inputs.steps || 'all' }}
