name: Collect jobs

# Free scheduled collection. This replaces the always-on worker, so nothing here
# needs a paid host. GitHub may delay scheduled runs by several minutes.
on:
  schedule:
    - cron: "17 * * * *" # hourly, at minute 17
  workflow_dispatch:
    inputs:
      steps:
        description: "discovery, companies, boards, gmail, or all"
        default: "all"

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: api
      # Required secret: your Neon connection string.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Must match the API's key: Gmail refresh tokens are encrypted with it.
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      USER_AGENT: ${{ vars.USER_AGENT || 'openHunt/0.1 (+https://github.com; personal job search)' }}
      # Optional: leave the secrets unset to skip a source.
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_MONTHLY_CAP: 250
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REDIRECT_URI: ${{ secrets.GMAIL_REDIRECT_URI }}
      WEB_APP_URL: ${{ vars.WEB_APP_URL }}
      GMAIL_POLL_INTERVAL_MINUTES: 10
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Apply database migrations
        working-directory: api
        run: python -m alembic upgrade head

      - name: Run collectors
        run: python -m worker.run_once ${{ github.event.inputs.steps || 'all' }}
