services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openhunt}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      APP_NAME: ${APP_NAME:?Set APP_NAME in .env}
      APP_ENV: development
      API_HOST: ${API_HOST:?Set API_HOST in .env}
      API_PORT: ${API_PORT:?Set API_PORT in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?Set ACCESS_TOKEN_EXPIRE_MINUTES in .env}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-admin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?Set DEFAULT_PASSWORD in .env}
      CORS_ORIGINS: '["http://localhost:3000"]'
      JOB_FETCH_INTERVAL_MINUTES: ${JOB_FETCH_INTERVAL_MINUTES:?Set JOB_FETCH_INTERVAL_MINUTES in .env}
      MAX_JOBS_PER_RUN: ${MAX_JOBS_PER_RUN:?Set MAX_JOBS_PER_RUN in .env}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:?Set REQUEST_TIMEOUT_SECONDS in .env}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:?Set REQUESTS_PER_MINUTE in .env}
      USER_AGENT: ${USER_AGENT:?Set USER_AGENT in .env}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:?Set API_TIMEOUT_SECONDS in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:?Set APP_NAME in .env}
      APP_ENV: development
      API_HOST: ${API_HOST:?Set API_HOST in .env}
      API_PORT: ${API_PORT:?Set API_PORT in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?Set ACCESS_TOKEN_EXPIRE_MINUTES in .env}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-admin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?Set DEFAULT_PASSWORD in .env}
      CORS_ORIGINS: '["http://localhost:3000"]'
      JOB_FETCH_INTERVAL_MINUTES: ${JOB_FETCH_INTERVAL_MINUTES:?Set JOB_FETCH_INTERVAL_MINUTES in .env}
      MAX_JOBS_PER_RUN: ${MAX_JOBS_PER_RUN:?Set MAX_JOBS_PER_RUN in .env}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:?Set REQUEST_TIMEOUT_SECONDS in .env}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:?Set REQUESTS_PER_MINUTE in .env}
      USER_AGENT: ${USER_AGENT:?Set USER_AGENT in .env}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:?Set API_TIMEOUT_SECONDS in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
