services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openhunt}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      APP_NAME: ${APP_NAME:?Set APP_NAME in .env}
      APP_ENV: development
      API_HOST: ${API_HOST:?Set API_HOST in .env}
      API_PORT: ${API_PORT:?Set API_PORT in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?Set ACCESS_TOKEN_EXPIRE_MINUTES in .env}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      ALLOWED_SIGNUP_EMAILS: ${ALLOWED_SIGNUP_EMAILS:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
      JOB_FETCH_INTERVAL_MINUTES: ${JOB_FETCH_INTERVAL_MINUTES:?Set JOB_FETCH_INTERVAL_MINUTES in .env}
      MAX_JOBS_PER_RUN: ${MAX_JOBS_PER_RUN:?Set MAX_JOBS_PER_RUN in .env}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:?Set REQUEST_TIMEOUT_SECONDS in .env}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:?Set REQUESTS_PER_MINUTE in .env}
      USER_AGENT: ${USER_AGENT:?Set USER_AGENT in .env}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:?Set API_TIMEOUT_SECONDS in .env}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_MONTHLY_CAP: ${SERPAPI_MONTHLY_CAP:-250}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      GMAIL_POLL_INTERVAL_MINUTES: ${GMAIL_POLL_INTERVAL_MINUTES:-10}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:?Set APP_NAME in .env}
      APP_ENV: development
      API_HOST: ${API_HOST:?Set API_HOST in .env}
      API_PORT: ${API_PORT:?Set API_PORT in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?Set ACCESS_TOKEN_EXPIRE_MINUTES in .env}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      ALLOWED_SIGNUP_EMAILS: ${ALLOWED_SIGNUP_EMAILS:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
      JOB_FETCH_INTERVAL_MINUTES: ${JOB_FETCH_INTERVAL_MINUTES:?Set JOB_FETCH_INTERVAL_MINUTES in .env}
      MAX_JOBS_PER_RUN: ${MAX_JOBS_PER_RUN:?Set MAX_JOBS_PER_RUN in .env}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:?Set REQUEST_TIMEOUT_SECONDS in .env}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:?Set REQUESTS_PER_MINUTE in .env}
      USER_AGENT: ${USER_AGENT:?Set USER_AGENT in .env}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:?Set API_TIMEOUT_SECONDS in .env}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_MONTHLY_CAP: ${SERPAPI_MONTHLY_CAP:-250}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      GMAIL_POLL_INTERVAL_MINUTES: ${GMAIL_POLL_INTERVAL_MINUTES:-10}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
